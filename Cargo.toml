[workspace]
members = ["crates/ttlock-core", "crates/ttlock", "crates/ttlock-py"]
# ttlock-py links libpython and is built with maturin, so keep it out of the
# default set that `cargo build`/`cargo test`/the nix package operate on.
default-members = ["crates/ttlock-core", "crates/ttlock"]
resolver = "3"

[workspace.package]
# Single source of truth for the version of every crate, the Python wheel (via
# maturin's dynamic version) and the Home Assistant component. `cargo release`
# or a manual bump here moves all of them together; CI asserts they agree.
version = "0.2.0"
edition = "2024"
license = "MIT"
authors = ["Nathan Henrie <nate@n8henrie.com>"]
repository = "https://github.com/n8henrie/ttlock-rs"
homepage = "https://github.com/n8henrie/ttlock-rs"
keywords = ["ttlock", "bluetooth", "ble", "lock", "home-assistant"]
categories = ["command-line-utilities", "hardware-support"]

[workspace.dependencies]
# `version` is required for `cargo publish`: crates.io rejects a bare path
# dependency, and it is what makes a published `ttlock` resolve `ttlock-core`
# from the registry. Cargo has no `version.workspace` for dependencies, so this
# literal must be bumped alongside `workspace.package.version` — CI enforces it.
ttlock-core = { path = "crates/ttlock-core", version = "0.2.0" }
aes = "0.9"
base64 = "0.23"
btleplug = "0.12"
cbc = { version = "0.2", features = ["alloc"] }
# `now` rather than `clock`: the only use is `Utc::now()` in the
# check-user-time payload. `clock` additionally enables `Local`, which
# drags in `iana-time-zone` and, on macOS, `core-foundation-sys` — a
# platform-integration dependency in what is otherwise a pure-Rust
# protocol library, and one more thing to link into a portable wheel.
chrono = { version = "0.4", default-features = false, features = ["now", "std"] }
cipher = { version = "0.5", features = ["alloc"] }
clap = { version = "4.5", features = ["derive", "env"] }
futures-util = "0.3"
hex = "0.4"
pyo3 = { version = "0.29", features = ["abi3-py312"] }
rumqttc = "0.25"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = "1"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
undocumented_unsafe_blocks = "deny"

[workspace.lints.rust]
unsafe_code = "forbid"
linker_messages = "allow"
