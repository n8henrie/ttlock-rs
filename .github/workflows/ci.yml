name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Every static check, via the same script the pre-commit hook runs. Keeping
  # CI and the hook on one script is deliberate: a hook that checks less than
  # CI teaches you to distrust it, and one that checks more blocks commits CI
  # would have accepted.
  #
  # The script re-enters the Nix dev shell itself, so the toolchain here is the
  # one the flake pins rather than whatever the runner ships.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@main
      - run: ./scripts/lint.sh

  # Everything Nix-shaped: builds every package and runs the NixOS VM test.
  # Too slow to sit in front of a commit, which is why `scripts/lint.sh` leaves
  # it alone.
  nix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@main
      - run: nix flake check --print-build-logs

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Test
        run: nix develop --command cargo test --workspace --exclude ttlock-py
      # Catches a missing `version` on a path dependency, a bad `readme`, or
      # anything else crates.io would reject — at PR time, not at release time.
      # Exercises exactly what the release workflow runs, including resolving
      # `ttlock` against the unpublished `ttlock-core` in this tree, so a PR
      # that bumps the version is still checked end to end.
      #
      # No `--allow-dirty`: that flag disables the temporary registry cargo
      # uses to let `ttlock` build against the `ttlock-core` being released,
      # which makes the verification step fail against whatever version is
      # already on crates.io.
      - name: Packaging dry run
        run: nix develop .#release --command cargo publish --dry-run --workspace

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@main
      # Linting and type checking happen in the `lint` job; this builds the
      # extension module and runs the suite against it.
      - name: Build bindings and test
        run: |
          nix develop --command bash -eux -c '
            python -m venv /tmp/venv
            . /tmp/venv/bin/activate
            pip install --quiet maturin pytest pycryptodome
            cd crates/ttlock-py
            maturin develop
            pytest tests -q
          '
